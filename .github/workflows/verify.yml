name: Verify macOS editor
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      signed_preview:
        description: Build and notarize a private universal macOS test DMG
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.signed_preview && '-signed-preview' || '' }}
  cancel-in-progress: ${{ !inputs.signed_preview }}

permissions:
  contents: read

jobs:
  frontend:
    name: Scope and frontend checks
    if: ${{ !inputs.signed_preview }}
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check whether runtime or verification files changed
        id: scope
        shell: bash
        env:
          # On a PR, GITHUB_SHA is the tested merge commit. For pushes use the entire push.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          full=true
          if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null &&
             git diff --quiet --no-renames "$BASE" "$GITHUB_SHA" -- . \
               ':(top,exclude)README.md' ':(top,exclude)docs/MACOS_PREVIEW.md' \
               ':(top,glob,exclude)docs/planning/*.md' ':(top,glob,exclude)docs/screenshots/*.png'; then
            full=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        if: steps.scope.outputs.full == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check the editor bundle, JavaScript tests and npm advisories
        if: steps.scope.outputs.full == 'true'
        run: |
          npm ci --no-audit
          npm run build:editor
          git diff --exit-code -- ui/vendor/editor.js
          npm test
          npm audit

  macos:
    needs: frontend
    if: needs.frontend.outputs.full == 'true'
    runs-on: macos-latest
    env:
      # The tests, exFAT fixture and Tauri child process all use this toolchain.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit
      - uses: ./.github/actions/check-msrv
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - run: scripts/test-exfat.sh
      - run: npm run build -- --ci --bundles app -- --locked
      # The license/OSV check selects the Cargo graph of the current host.
      - run: node scripts/check-dependencies.mjs --advisories

  linux:
    name: Compile on ubuntu-24.04
    needs: frontend
    if: needs.frontend.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: ./.github/actions/check-msrv

  windows:
    name: Compile on windows-latest
    needs: frontend
    if: needs.frontend.outputs.full == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-msrv

  verify:
    name: Verify
    needs: [frontend, macos, linux, windows]
    if: always() && !inputs.signed_preview
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable check
        env:
          FRONTEND: ${{ needs.frontend.result }}
          FULL: ${{ needs.frontend.outputs.full }}
          MACOS: ${{ needs.macos.result }}
          LINUX: ${{ needs.linux.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          case "$FULL" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          [[ "$FRONTEND" == success && "$MACOS" == "$expected" && "$LINUX" == "$expected" && "$WINDOWS" == "$expected" ]]

  signed-preview:
    name: Signed universal macOS test DMG
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private && github.ref_type == 'branch' && inputs.signed_preview
    runs-on: macos-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build both architectures before loading the signing key
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npm ci --no-audit
          npm run build -- --ci --no-bundle --target universal-apple-darwin -- --locked
      - name: Import the Developer ID Application certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/import-preview-certificate.sh
      - name: Sign the universal app and verify a copy from the disk image
        run: node scripts/build-macos-preview.mjs --bundle-universal
      - name: Remove the temporary signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/kladje-signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
      - name: Submit the signed DMG to Apple
        id: submit
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          dmg="src-tauri/target/universal-apple-darwin/release/bundle/dmg/Kladje_${version}_universal.dmg"
          submission=$(xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --output-format json | jq -er '.id')
          echo "submission=$submission" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "Apple notary submission: $submission" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Wait for acceptance, staple the ticket and check Gatekeeper
        id: staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SUBMISSION: ${{ steps.submit.outputs.submission }}
          DMG: ${{ steps.submit.outputs.dmg }}
        run: |
          set -euo pipefail
          auth=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD")
          status=$(xcrun notarytool wait "$SUBMISSION" "${auth[@]}" --timeout 35m --output-format json | jq -er '.status')
          if [[ "$status" != Accepted ]]; then
            echo "::error::Apple notarization returned $status for $SUBMISSION"
            exit 1
          fi
          cd "$(dirname "$DMG")"
          dmg=$(basename "$DMG")
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          hdiutil verify "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          cat "$dmg.sha256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Kladje-universal-macOS-test
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      # Keep the submitted bytes available if Apple takes longer than this run.
      - name: Retain the submitted disk image for notarization recovery
        if: failure() && steps.submit.outcome == 'success' && steps.staple.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notary-recovery-${{ steps.submit.outputs.submission }}
          path: ${{ steps.submit.outputs.dmg }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
