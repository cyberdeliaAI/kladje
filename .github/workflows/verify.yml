name: Verify macOS editor
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_test:
        description: Build and verify a private Windows x64 test installer
        type: boolean
        default: false
      windows_artifact_run:
        description: Verify the installer from an earlier Windows test run without rebuilding
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    if: ${{ !inputs.windows_test }}
    name: Scope and frontend checks
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check whether runtime or verification files changed
        id: scope
        shell: bash
        env:
          # On a PR, GITHUB_SHA is the tested merge commit. For pushes use the entire push.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          full=true
          if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null &&
             git diff --quiet --no-renames "$BASE" "$GITHUB_SHA" -- . \
               ':(top,exclude)README.md' ':(top,exclude)docs/MACOS_PREVIEW.md' \
               ':(top,glob,exclude)docs/planning/*.md' ':(top,glob,exclude)docs/screenshots/*.png'; then
            full=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        if: steps.scope.outputs.full == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check the editor bundle, JavaScript tests and npm advisories
        if: steps.scope.outputs.full == 'true'
        run: |
          npm ci --no-audit
          npm run build:editor
          git diff --exit-code -- ui/vendor/editor.js
          npm test
          npm audit

  macos:
    needs: frontend
    if: needs.frontend.outputs.full == 'true'
    runs-on: macos-latest
    env:
      # The tests, exFAT fixture and Tauri child process all use this toolchain.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit
      - uses: ./.github/actions/check-msrv
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - run: scripts/test-exfat.sh
      - run: npm run build -- --ci --bundles app -- --locked
      # The license/OSV check selects the Cargo graph of the current host.
      - run: node scripts/check-dependencies.mjs --advisories

  linux:
    name: Compile on ubuntu-24.04
    needs: frontend
    if: needs.frontend.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: ./.github/actions/check-msrv

  windows:
    name: Compile on windows-latest
    needs: frontend
    if: needs.frontend.outputs.full == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-msrv

  verify:
    name: Verify
    needs: [frontend, macos, linux, windows]
    if: always() && !inputs.windows_test
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable check
        env:
          FRONTEND: ${{ needs.frontend.result }}
          FULL: ${{ needs.frontend.outputs.full }}
          MACOS: ${{ needs.macos.result }}
          LINUX: ${{ needs.linux.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          case "$FULL" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          [[ "$FRONTEND" == success && "$MACOS" == "$expected" && "$LINUX" == "$expected" && "$WINDOWS" == "$expected" ]]

  windows-test-installer:
    name: Windows x64 test installer
    if: github.event_name == 'workflow_dispatch' && inputs.windows_test && github.event.repository.private && github.ref == 'refs/heads/codex/windows-test-preview'
    runs-on: windows-latest
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: inputs.windows_artifact_run == ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        if: inputs.windows_artifact_run == ''
        run: npm ci --no-audit
      - name: Build the x64 NSIS installer
        if: inputs.windows_artifact_run == ''
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'kladje-windows-test.json'
          @{
            productName = 'Kladje Windows Test'
            identifier = 'app.kladje.editor.windowstest'
            bundle = @{
              fileAssociations = @()
              windows = @{
                nsis = @{ installMode = 'currentUser' }
              }
            }
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 $config
          npm run build -- --ci --target x86_64-pc-windows-msvc --bundles nsis --config $config -- --locked
      - name: Prepare the test installer
        id: stage
        if: inputs.windows_artifact_run == ''
        shell: pwsh
        run: |
          $release = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          $installers = @(Get-ChildItem "$release/bundle/nsis" -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, got $($installers.Count)." }
          New-Item -ItemType Directory -Path windows-test-output | Out-Null
          $output = 'windows-test-output/Kladje-Windows-Test-0.1.0-r2-x64-setup.exe'
          Copy-Item -LiteralPath $installers[0].FullName -Destination $output
          $checksum = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "Windows x64 installer SHA256: $checksum"
          "Windows x64 installer SHA-256: $checksum" >> $env:GITHUB_STEP_SUMMARY
      - name: Download the existing test installer
        if: inputs.windows_artifact_run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_ARTIFACT_RUN: ${{ inputs.windows_artifact_run }}
        run: |
          $run = $env:WINDOWS_ARTIFACT_RUN
          if ($run -notmatch '^\d+$') { throw 'Expected a numeric GitHub Actions run ID.' }
          $source = gh run view $run --repo $env:GITHUB_REPOSITORY --json headBranch,event,workflowName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $source.headBranch -ne $env:GITHUB_REF_NAME -or
              $source.event -ne 'workflow_dispatch' -or $source.workflowName -ne $env:GITHUB_WORKFLOW) {
            throw 'The artifact must come from this workflow and test branch.'
          }
          gh run download $run --repo $env:GITHUB_REPOSITORY --name Kladje-Windows-Test-r2-x64 --dir windows-test-output
      - name: Install and launch Kladje
        shell: pwsh
        run: |
          $installer = Get-Item -LiteralPath 'windows-test-output/Kladje-Windows-Test-0.1.0-r2-x64-setup.exe'
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "Testing Windows x64 installer SHA256: $checksum"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/NS' -PassThru
          if (!$process.WaitForExit(120000)) {
            $process.Kill()
            throw 'The silent installer did not finish within two minutes.'
          }
          if ($process.ExitCode -ne 0) { throw "The installer returned $($process.ExitCode)." }

          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Kladje Windows Test'
          $registration = Get-ItemProperty -LiteralPath $uninstallKey
          $installDir = $registration.InstallLocation.Trim('"')
          $installed = Join-Path $installDir $registration.MainBinaryName
          $extracted = Join-Path $env:RUNNER_TEMP 'kladje-embedded-executable'
          & 'C:\Program Files\7-Zip\7z.exe' e $installer.FullName "-o$extracted" $registration.MainBinaryName -y
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the bundled executable.' }
          $bundled = Join-Path $extracted $registration.MainBinaryName
          $bundledHash = (Get-FileHash -LiteralPath $bundled -Algorithm SHA256).Hash
          $installedHash = (Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash
          if ($installedHash -ne $bundledHash) { throw 'The installed executable did not match the bundled app.' }
          $reader = [IO.BinaryReader]::new([IO.File]::OpenRead($installed))
          try {
            if ($reader.ReadUInt16() -ne 0x5A4D) { throw 'Missing DOS header.' }
            $reader.BaseStream.Position = 0x3C
            $reader.BaseStream.Position = $reader.ReadInt32()
            if ($reader.ReadUInt32() -ne 0x4550 -or $reader.ReadUInt16() -ne 0x8664) {
              throw 'The installed payload is not a Windows AMD64 executable.'
            }
          } finally {
            $reader.Dispose()
          }

          Write-Output 'Verified silent installation and matching x64 executable.'
          & ./.github/workflows/windows-menu-smoke.ps1 -Editor $installed
          "Verified silent installation, x64 payload, editor startup and the Windows menu actions. SHA-256: $checksum" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        with:
          name: Kladje-Windows-Test-r2-x64
          path: windows-test-output/Kladje-Windows-Test-0.1.0-r2-x64-setup.exe
          if-no-files-found: error
          retention-days: 7
