<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kladje</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="preview.css">
  <link rel="stylesheet" href="vendor/mathml.css">
  <!-- Syntax colours come from the Rust side: one sheet for the screen theme, a light one for print. -->
  <style id="syntax-screen" media="screen"></style>
  <style id="syntax-print" media="print"></style>
</head>
<body>
  <div id="app" data-view="split" data-pointer-focus="true" data-empty="true">
    <main id="panes">
      <section id="editor-pane" aria-label="Markdown source"></section>
      <div id="divider" role="separator" tabindex="0" aria-label="Source pane width" aria-controls="editor-pane" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50" aria-valuetext="50% source, 50% preview" aria-orientation="vertical" title="Drag to resize, double-click to reset"></div>
      <section id="preview-pane" tabindex="-1" aria-label="Preview">
        <div id="preview-status" hidden><div><span id="preview-status-text"></span><button type="button" id="preview-refresh">Refresh Preview</button></div></div>
        <article id="preview" class="markdown-body"></article>
        <div id="start" hidden>
          <img class="start-wordmark wordmark-light" src="brand/kladje-wordmark.svg" alt="Kladje">
          <img class="start-wordmark wordmark-dark" src="brand/kladje-wordmark-dark.svg" alt="Kladje">
          <nav class="start-group" aria-labelledby="start-actions-title">
            <h2 id="start-actions-title">Start</h2>
            <ul id="start-actions"></ul>
          </nav>
          <nav class="start-group" id="start-recent-group" aria-labelledby="start-recent-title" hidden>
            <h2 id="start-recent-title">Recent</h2>
            <ul id="start-recent"></ul>
          </nav>
        </div>
      </section>
    </main>
    <footer id="statusbar">
      <div id="doc-name" role="status" aria-atomic="true"><span></span><span class="sr-only" id="doc-state"></span></div>
      <div id="notice" role="status" aria-live="polite"></div>
      <div id="stats"></div>
      <button type="button" id="outline-toggle" class="chrome-button" title="Document outline" aria-label="Document outline" aria-pressed="false">
        <svg viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M1.5 2.5h7M4 6h7.5M4 9.5h5.5"/></svg>
      </button>
      <div id="view-switch" role="group" aria-label="Layout">
        <button type="button" data-view="editor" title="Editor only" aria-label="Editor only">
          <svg viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2 2.5h10M2 6h10M2 9.5h6"/></svg>
        </button>
        <button type="button" data-view="split" title="Editor and preview" aria-label="Editor and preview">
          <svg viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="1" width="12" height="10" rx="2"/><path d="M7 1v10"/></svg>
        </button>
        <button type="button" data-view="preview" title="Preview only" aria-label="Preview only">
          <svg viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M1 6s2.2-4 6-4 6 4 6 4-2.2 4-6 4-6-4-6-4z"/><circle cx="7" cy="6" r="1.6"/></svg>
        </button>
      </div>
    </footer>
  <dialog id="outline" aria-labelledby="outline-title">
    <form id="heading-form">
      <div class="outline-head">
        <h2 id="outline-title">Jump to Heading</h2>
        <button type="button" id="outline-close" class="chrome-button" title="Hide outline" aria-label="Hide outline">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>
        </button>
      </div>
      <input id="heading-filter" type="search" aria-label="Filter headings" placeholder="Filter headings" autofocus>
      <div id="heading-list" role="tree" tabindex="0" aria-label="Document headings"></div>
      <p id="heading-count" role="status"></p>
      <div id="heading-pages" hidden><button type="button" id="heading-prev">Previous 100</button> <button type="button" id="heading-next">Next 100</button></div>
      <div class="dialog-actions"><button type="button" id="heading-cancel">Cancel</button><button id="heading-go" type="submit">Go to Heading</button></div>
    </form>
  </dialog>
  </div>
  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog">
      <h2 id="settings-title">Writing Settings</h2>
      <label><input type="checkbox" id="autosave"> Save automatically after a pause in typing and when you switch away</label>
      <label><input type="checkbox" id="pairing"> Pair brackets and quotes while typing</label>
      <label><input type="checkbox" id="linkPaste"> Paste a URL over selected text as a link</label>
      <label><input type="checkbox" id="htmlPaste"> Convert pasted rich text to Markdown</label>
      <label><input type="checkbox" id="confirmImage"> Ask before saving pasted images beside a saved document</label>
      <label><input type="checkbox" id="focusParagraph"> Emphasize the current paragraph</label>
      <label><input type="checkbox" id="typewriter"> Center the cursor while typing</label>
      <label><input type="checkbox" id="readingTime"> Show estimated reading time</label>
      <label><input type="checkbox" id="lineBreaks"> Show a single Return as a line break in the preview, PDF and HTML export</label>
      <div class="dialog-actions"><button>Done</button></div>
    </form>
  </dialog>
  <dialog id="comparison" aria-labelledby="comparison-title" aria-describedby="comparison-summary">
    <h2 id="comparison-title">Compare with Disk</h2>
    <p id="comparison-summary"></p>
    <div class="comparison-labels" aria-hidden="true"><span>This window</span><span>On disk</span></div>
    <div id="comparison-view"></div>
    <form method="dialog" class="dialog-actions"><button type="button" id="comparison-previous">Previous Change</button><button type="button" id="comparison-next">Next Change</button><button autofocus>Close</button></form>
  </dialog>
  <script src="vendor/editor.js"></script>
  <script src="document-session.js"></script>
  <script src="diagrams.js"></script>
  <script src="app.js"></script>
</body>
</html>
