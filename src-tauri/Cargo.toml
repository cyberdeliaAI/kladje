[package]
name = "kladje"
version = "0.1.0"
description = "A light, fast Markdown editor with live preview"
edition = "2021"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = { version = "1.2", default-features = false, features = ["shortcodes"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
pulldown-latex = "0.8"
ammonia = "4"
htmd = "0.6"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
