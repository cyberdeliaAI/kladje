[package]
name = "kladje"
version = "0.1.0"
description = "A light, fast Markdown editor with live preview"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = { version = "1.2", default-features = false, features = ["shortcodes"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
pulldown-latex = "0.8"
ammonia = "4"
htmd = "0.6"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"

# Already present in Cargo.lock. Used for exclusive staging and byte fingerprints.
tempfile = "3"
sha2 = "0.10"
base64 = "0.21"
percent-encoding = "2"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# These bindings are already used by Tauri's macOS webview. Native margins
# keep WebKit's page count and the system print sheet in agreement.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPrintInfo", "NSPrintOperation", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView", "WKWebViewConfiguration", "WKPreferences", "objc2-app-kit"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
