[package]
name = "kladje"
version = "0.2.0"
description = "A light, fast Markdown editor with live preview"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = { version = "1.2", default-features = false, features = ["shortcodes"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
pulldown-latex = "0.8"
ammonia = "4"
htmd = "0.6"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"

# Already present in Cargo.lock. Used for exclusive staging and byte fingerprints.
same-file = "1"
tempfile = "3"
sha2 = "0.10"
base64 = "0.21"
getrandom = "0.3"
percent-encoding = "2"
semver = "1"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# These bindings are already used by Tauri's macOS webview. Native margins
# keep WebKit's page count and the system print sheet in agreement.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSString", "NSURL", "NSValue", "NSDictionary"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSDocumentController", "NSMenu", "NSMenuItem", "NSPasteboard", "NSPrintInfo", "NSPrintOperation", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKUIDelegate", "WKWebView", "WKWebViewConfiguration", "WKPreferences", "block2", "objc2-app-kit"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell_Common",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
